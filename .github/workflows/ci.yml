name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: shell installer tests
        if: matrix.os != 'windows-latest'
        run: |
          sh -n install.sh
          python3 tests/test_install.py

      - name: vet
        run: go vet ./...

      - name: vet (omp build tag)
        run: go vet -tags omp ./...

      - name: test
        run: go test ./...

      - name: test (omp build tag)
        run: go test -tags omp ./...

      - name: build
        run: go build .

      - name: build (omp build tag)
        run: go build -tags omp .

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null . \
              && echo "ok   $target" || { echo "fail $target"; exit 1; }
          done
